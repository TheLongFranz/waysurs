name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A newer push to the same ref makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "20"

jobs:
  # ── Formatting and static analysis ──────────────────────────────────────────
  # Both gates are hard failures. .clang-tidy sets WarningsAsErrors: '*', so any
  # enabled check failing fails the job.
  lint:
    name: clang-format + clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }} and build tools
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y \
            clang-format-${{ env.LLVM_VERSION }} \
            clang-tidy-${{ env.LLVM_VERSION }} \
            clang-tools-${{ env.LLVM_VERSION }} \
            ninja-build catch2

      - name: clang-format
        run: |
          find include src test \( -name '*.hpp' -o -name '*.cpp' -o -name '*.ipp' \) -print0 \
            | xargs -0 /usr/lib/llvm-${{ env.LLVM_VERSION }}/bin/clang-format \
                --style=file --dry-run --Werror

      - name: Generate compile database
        # CMAKE_CXX_SCAN_FOR_MODULES=OFF keeps Ninja's @...modmap flags out of
        # compile_commands.json; they only exist after a build and clang-tidy
        # reports them as a hard error.
        run: |
          cmake --preset release \
            -DCMAKE_C_COMPILER=/usr/lib/llvm-${{ env.LLVM_VERSION }}/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-${{ env.LLVM_VERSION }}/bin/clang++ \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      - name: clang-tidy
        # The path filter keeps analysis to first-party code even if Catch2 is
        # ever fetched from source into the compile database.
        run: |
          /usr/lib/llvm-${{ env.LLVM_VERSION }}/bin/run-clang-tidy \
            -p out/build/release \
            -clang-tidy-binary /usr/lib/llvm-${{ env.LLVM_VERSION }}/bin/clang-tidy \
            -quiet \
            "${{ github.workspace }}/(src|test)/"

  # ── Build and test across compilers and platforms ───────────────────────────
  build:
    name: ${{ matrix.os }} / ${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: clang-20, cxx: clang++-20 }
          - { os: ubuntu-latest, cc: gcc-15, cxx: g++-15 }
          - { os: macos-latest, cc: clang, cxx: clang++ }
          - { os: macos-latest, cc: clang-20, cxx: clang++-20 }
          - { os: macos-26-intel, cc: clang, cxx: clang++ }
          - { os: macos-26-intel, cc: clang-20, cxx: clang++-20 }

    steps:
      - uses: actions/checkout@v4

      # socat provides the virtual PTY pair the tests run against; catch2 keeps
      # CMake from fetching and rebuilding Catch2 from source.
      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build socat catch2

      - name: Install test dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja socat catch2

      - name: Install GCC 15 (Linux)
        if: matrix.cc == 'gcc-15'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15

      - name: Install LLVM ${{ env.LLVM_VERSION }} (Linux)
        if: runner.os == 'Linux' && matrix.cc == 'clang-20'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}

      - name: Install LLVM ${{ env.LLVM_VERSION }} (macOS)
        if: runner.os == 'macOS' && matrix.cc == 'clang-20'
        run: brew install llvm@${{ env.LLVM_VERSION }}

      - name: Resolve compiler paths
        id: cc
        shell: bash
        # Homebrew's llvm@20 is keg-only, so it needs an absolute path. Passing
        # both compilers explicitly also makes cmake/llvm-toolchain.cmake skip
        # auto-detection, which is what keeps clang-tidy off the build path.
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.cc }}" = "clang-20" ]; then
            prefix="$(brew --prefix llvm@${{ env.LLVM_VERSION }})"
            echo "cc=${prefix}/bin/clang"    >> "$GITHUB_OUTPUT"
            echo "cxx=${prefix}/bin/clang++" >> "$GITHUB_OUTPUT"
          else
            echo "cc=${{ matrix.cc }}"   >> "$GITHUB_OUTPUT"
            echo "cxx=${{ matrix.cxx }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: |
          cmake --preset release \
            -DCMAKE_C_COMPILER=${{ steps.cc.outputs.cc }} \
            -DCMAKE_CXX_COMPILER=${{ steps.cc.outputs.cxx }}

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  # ── AddressSanitizer + UndefinedBehaviorSanitizer ───────────────────────────
  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catch2 is deliberately NOT installed here. A prebuilt, uninstrumented
      # Catch2 linked against instrumented code makes libc++'s container
      # annotations disagree and ASan reports spurious container-overflows, so
      # the asan-ubsan preset also sets CMAKE_DISABLE_FIND_PACKAGE_Catch2 to
      # force a from-source build even if one is installed.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build socat
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}

      - name: Configure
        run: |
          cmake --preset asan-ubsan \
            -DCMAKE_C_COMPILER=/usr/lib/llvm-${{ env.LLVM_VERSION }}/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-${{ env.LLVM_VERSION }}/bin/clang++

      - name: Build
        run: cmake --build --preset asan-ubsan

      - name: Test
        # -fno-sanitize-recover=all in the preset makes UBSan abort rather than
        # log and continue, so a finding fails the job instead of scrolling past.
        run: ctest --preset asan-ubsan
